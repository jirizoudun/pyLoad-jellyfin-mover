version: '3.8'

services:
  pyload-jellyfin-mover:
    build: .
    container_name: pyload-jellyfin-mover
    ports:
      - "8080:8080"
    volumes:
      # Use absolute host paths, NOT "~": the self-update watcher runs
      # docker-compose as root, so "~" expands to /root (empty) instead of the
      # media owner's home. Override these via the environment (or a .env file)
      # if your media lives elsewhere; defaults match the documented setup.
      - ${DOWNLOADS_HOST_DIR:-/home/zoudy/Downloads}:/app/Downloads
      - ${MOVIES_HOST_DIR:-/home/zoudy/Movies}:/app/Movies
      - ${SERIES_HOST_DIR:-/home/zoudy/Series}:/app/Series
      # Bind mount so the "Update & Restart" button can drop a flag file the
      # host-side watcher picks up (see SELF_UPDATE.md).
      - ./update_trigger:/app/update_trigger
    environment:
      - FLASK_ENV=production
      - DOWNLOADS_DIR=/app/Downloads
      - MOVIES_DIR=/app/Movies
      - SERIES_DIR=/app/Series
      - UPDATE_TRIGGER_DIR=/app/update_trigger
    restart: unless-stopped